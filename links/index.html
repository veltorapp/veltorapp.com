<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veltor — Links</title>
  <meta name="description" content="Veltor — an app that adds soul to your car. Find us everywhere.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="apple-touch-icon" href="../assets/logo-icon.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Veltor — Links">
  <meta property="og:description" content="An app that adds soul to your car. Find us everywhere.">
  <meta property="og:image" content="https://veltorapp.com/assets/og.png">
  <meta property="og:url" content="https://veltorapp.com/links">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #4FC3F7;
      --white: #FFFFFF;
      --muted: #888888;
      --bg: #000000;
      --surface: #0C0C0C;
      --border: rgba(255, 255, 255, 0.09);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 20px 40px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(79, 195, 247, 0.10) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 108px;
      height: 108px;
      object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(79, 195, 247, 0.35));
      margin-bottom: 20px;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .wordmark {
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 5px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--white);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-btn:hover {
      border-color: rgba(79, 195, 247, 0.4);
      background: #111;
    }

    .link-btn.primary {
      background: var(--blue);
      color: #000;
      border-color: var(--blue);
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
    }

    .link-btn.primary:hover {
      background: var(--blue);
      opacity: 0.9;
    }

    .link-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-icon svg {
      width: 100%;
      height: 100%;
    }

    .link-arrow {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
      flex-shrink: 0;
    }

    .link-btn.primary .link-arrow {
      color: rgba(0, 0, 0, 0.5);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 44px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--white);
    }
  </style>
</head>

<body>

  <div class="wrap">
    <img class="logo" src="../assets/logo.png" alt="Veltor">
    <div class="wordmark">VELTOR</div>
    <p class="tagline">An app that adds soul to your car.</p>

    <div class="links">
      <a class="link-btn primary" href="https://veltorapp.com">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg>
        </span>
        veltorapp.com
        <span class="link-arrow">→</span>
      </a>

      <a class="link-btn" href="https://instagram.com/veltorapp" target="_blank" rel="noopener">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </span>
        Instagram
        <span class="link-arrow">→</span>
      </a>

      <a class="link-btn" href="https://x.com/veltorapp" target="_blank" rel="noopener">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.9 2H22l-7.6 8.7L23 22h-7.1l-5.5-7.2L4 22H1l8.1-9.3L1 2h7.3l5 6.6L18.9 2zm-1.2 18h1.7L6.4 4H4.5l13.2 16z" />
          </svg>
        </span>
        X (Twitter)
        <span class="link-arrow">→</span>
      </a>

      <a class="link-btn" href="https://youtube.com/@veltorapp" target="_blank" rel="noopener">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="4" />
            <polygon points="10 9 15 12 10 15 10 9" fill="currentColor" stroke="none" />
          </svg>
        </span>
        YouTube
        <span class="link-arrow">→</span>
      </a>

      <a class="link-btn" href="https://facebook.com/veltorapp" target="_blank" rel="noopener">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3.5l.5-4h-4V7a1 1 0 0 1 1-1h3z" />
          </svg>
        </span>
        Facebook
        <span class="link-arrow">→</span>
      </a>

      <a class="link-btn" href="mailto:veltorapp@gmail.com">
        <span class="link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m22 6-10 7L2 6" />
          </svg>
        </span>
        veltorapp@gmail.com
        <span class="link-arrow">→</span>
      </a>
    </div>
  </div>

  <footer>
    <a href="https://veltorapp.com/privacy">Privacy</a> &nbsp;·&nbsp;
    <a href="https://veltorapp.com/support">Support</a> &nbsp;·&nbsp;
    © 2026 Veltor
  </footer>

</body>

</html>
